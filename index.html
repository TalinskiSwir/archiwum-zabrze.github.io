<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiwum zdjęć Zabrza · XX wiek (edycja + filtry)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #2b2b2b;
            font-family: 'Courier New', Courier, monospace;
            color: #d4d4d4;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: #f0e6d2;
            border-bottom: 2px solid #5a5a5a;
            padding-bottom: 0.2em;
            margin-bottom: 10px;
            text-align: center;
        }
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }
        .btn {
            background: #4a4035;
            border: 1px solid #7a6f5e;
            color: #f0e6d2;
            padding: 8px 18px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 4px;
        }
        .btn:hover { background: #6b5e4a; border-color: #b0a590; }

        /* Filtry dekad */
        .filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }
        .filter-btn {
            background: #3a3a3a;
            border: 1px solid #5c5c5c;
            color: #ddd;
            padding: 6px 14px;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 4px;
        }
        .filter-btn:hover {
            background: #4e4e4e;
            border-color: #b0a590;
            color: #f5f0e6;
        }
        .filter-btn.active {
            background: #6b5e4a;
            border-color: #c0b090;
            color: #fff;
            font-weight: bold;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1100px;
            width: 100%;
            margin-top: 20px;
        }
        .card {
            background: #3a342c;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #555;
            transition: 0.2s;
            position: relative;
        }
        .card:hover { border-color: #b0a590; transform: translateY(-4px); }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            filter: grayscale(20%) sepia(10%);
        }
        .card:hover img { filter: grayscale(0%) sepia(0%); }
        .card .actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .card:hover .actions { opacity: 1; }
        .icon-btn {
            background: rgba(0,0,0,0.6);
            border: none;
            color: #ddd;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .icon-btn:hover { background: #b0a590; color: #1e1b16; }
        .caption {
            padding: 12px;
            background: #2f2a22;
            color: #ddd8ce;
            font-size: 0.9rem;
        }
        .year { font-weight: bold; color: #c7b595; margin-right: 6px; }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20,20,20,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border: 4px solid #b0a590;
            background: #1e1b16;
        }
        .lightbox .close {
            position: absolute;
            top: 25px; right: 35px;
            font-size: 40px;
            color: #ccc;
            cursor: pointer;
            background: none;
            border: none;
        }
        .desc {
            color: #dbceb0;
            margin-top: 15px;
            background: #2e2a22;
            padding: 8px 20px;
            border-radius: 4px;
            max-width: 90%;
            text-align: center;
        }

        /* Modal edycji/dodawania */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #3a342c;
            border: 1px solid #7a6f5e;
            border-radius: 8px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            color: #ddd;
        }
        .modal-content h3 { margin-bottom: 15px; color: #f0e6d2; }
        .modal-content label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #b0a590; }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            background: #2b2b2b;
            border: 1px solid #5a5a5a;
            color: #ddd;
            font-family: inherit;
            border-radius: 4px;
        }
        .modal-content .btn-group { display: flex; gap: 10px; justify-content: flex-end; }
        footer { margin-top: auto; padding: 20px; color: #7a7568; text-align: center; }
        @media (max-width: 500px) { .gallery { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>📷 Archiwum Zabrza · XX wiek</h1>
    <p style="color:#b0a590; text-align:center;">Dodawaj, edytuj i filtruj zdjęcia według dekad</p>

    <div class="top-bar">
        <button class="btn" id="addPhotoBtn">＋ Dodaj zdjęcie</button>
        <span style="color:#7a7568; font-size:0.85rem;">(zmiany zapisywane automatycznie)</span>
    </div>

    <!-- Filtry dekad -->
    <div class="filters" id="filterContainer">
        <button class="filter-btn active" data-decade="all">Wszystkie</button>
        <button class="filter-btn" data-decade="1900">1900–1910</button>
        <button class="filter-btn" data-decade="1910">1910–1920</button>
        <button class="filter-btn" data-decade="1920">1920–1930</button>
        <button class="filter-btn" data-decade="1930">1930–1940</button>
        <button class="filter-btn" data-decade="1940">1940–1950</button>
        <button class="filter-btn" data-decade="1950">1950–1960</button>
        <button class="filter-btn" data-decade="1960">1960–1970</button>
        <button class="filter-btn" data-decade="1970">1970–1980</button>
        <button class="filter-btn" data-decade="1980">1980–1990</button>
        <button class="filter-btn" data-decade="1990">1990–2000</button>
    </div>

    <div class="gallery" id="gallery"></div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="close" id="closeLightbox">&times;</button>
        <img id="lightboxImg" src="" alt="">
        <div class="desc" id="lightboxDesc"></div>
    </div>

    <!-- Modal edycji -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3 id="modalTitle">Dodaj nowe zdjęcie</h3>
            <label>URL obrazu (link bezpośredni)</label>
            <input type="text" id="imgUrl" placeholder="https://...">
            <label>Nazwa / alt</label>
            <input type="text" id="imgAlt" placeholder="Krótki opis zdjęcia">
            <label>Rok</label>
            <input type="text" id="imgYear" placeholder="np. 1938">
            <label>Opis (wyświetlany w lightboxie)</label>
            <textarea id="imgDesc" rows="2" placeholder="Szerszy kontekst..."></textarea>
            <div class="btn-group">
                <button class="btn" id="savePhotoBtn">Zapisz</button>
                <button class="btn" id="cancelEditBtn">Anuluj</button>
            </div>
        </div>
    </div>

    <footer>Źródło: Wikimedia Commons / NAC · domena publiczna</footer>

    <script>
        const STORAGE_KEY = 'zabrzeArchivePhotos';
        const defaultPhotos = [
            {
                id: 1,
                src: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Illustrierter_F%C3%BChrer_durch_das_Oberschlesische_Industriegebiet_mit_besonderer_Ber%C3%BCcksichtigung_der_Orte_Kattowitz%2C_K%C3%B6nigsh%C3%BCtte%2C_Beuthen%2C_Tarnowitz%2C_Zabrze_und_Gleiwitz_1904_%2890506001%29.jpg/1280px-thumbnail.jpg",
                alt: "Huta Zabrze",
                year: "1904",
                desc: "Huta Zabrze (widok z przewodnika po okręgu przemysłowym), ok. 1904 r."
            },
            {
                id: 2,
                src: "https://upload.wikimedia.org/wikipedia/commons/e/ef/Hindenburg%2C_Oberschl._Michaeltorplatz_u._Horst_Wessel_Denkmal.jpg",
                alt: "Plac Słowiański (Michaeltorplatz) w Zabrzu",
                year: "1935",
                desc: "Plac Słowiański (Michaeltorplatz) z pomnikiem Horsta Wessela, ok. 1935 r."
            },
            {
                id: 3,
                src: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/Krzysztof_Dziadak_na_prote%C5%9Bcie_w_Zabrzu._1992_r.jpg/1280px-Krzysztof_Dziadak_na_prote%C5%9Bcie_w_Zabrzu._1992_r.jpg",
                alt: "Protest ekologiczny w Zabrzu",
                year: "1992",
                desc: "Protest przeciwko degradacji środowiska, 1992 r. (fot. Krzysztof Dziadak)"
            },
            {
                id: 4,
                src: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Krzysztof_dziadak_i_Waldemar_Pawlak.jpg/960px-Krzysztof_dziadak_i_Waldemar_Pawlak.jpg",
                alt: "Spotkanie na KWK Makoszowy",
                year: "1992",
                desc: "Spotkanie z Waldemarem Pawlakiem na KWK Makoszowy po protestach górników, 1992 r."
            }
        ];

        let photos = [];
        let currentFilter = 'all';   // aktywny filtr dekady

        // Wczytaj z localStorage
        function loadPhotos() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    photos = JSON.parse(stored);
                } catch (e) {
                    photos = [...defaultPhotos];
                }
            } else {
                photos = [...defaultPhotos];
            }
        }

        function savePhotos() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
        }

        function resetToDefault() {
            photos = [...defaultPhotos];
            savePhotos();
            renderGallery(currentFilter);
        }

        // ---------- GALERIA ----------
        const galleryEl = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxDesc = document.getElementById('lightboxDesc');

        // Filtruje zdjęcia według dekady
        function filterByDecade(photosArray, decade) {
            if (decade === 'all') return photosArray;
            const decadeStart = parseInt(decade, 10);
            if (isNaN(decadeStart)) return [];
            return photosArray.filter(photo => {
                const yearNum = parseInt(photo.year, 10);
                if (isNaN(yearNum)) return false;
                return yearNum >= decadeStart && yearNum < decadeStart + 10;
            });
        }

        function renderGallery(decade = 'all') {
            currentFilter = decade;  // zapamiętujemy
            const filtered = filterByDecade(photos, decade);
            galleryEl.innerHTML = '';

            if (filtered.length === 0) {
                galleryEl.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#aaa;">Brak zdjęć w wybranej dekadzie.</p>';
                return;
            }

            filtered.forEach((photo, indexInFiltered) => {
                // Znajdź oryginalny indeks w głównej tablicy (potrzebny do edycji/usuwania)
                const realIndex = photos.findIndex(p => p.id === photo.id);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${photo.src}" alt="${photo.alt}" loading="lazy"
                         onclick="openLightbox('${photo.src}', '${photo.year} – ${photo.desc}')">
                    <div class="actions">
                        <button class="icon-btn" title="Edytuj" onclick="event.stopPropagation(); openEditModal(${realIndex})">✎</button>
                        <button class="icon-btn" title="Usuń" onclick="event.stopPropagation(); deletePhoto(${realIndex})">✕</button>
                    </div>
                    <div class="caption"><span class="year">${photo.year}</span>${photo.alt}</div>
                `;
                galleryEl.appendChild(card);
            });

            // Aktualizuj aktywny przycisk filtru
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-decade') === decade) {
                    btn.classList.add('active');
                }
            });
        }

        // Lightbox
        function openLightbox(src, descText) {
            lightboxImg.src = src;
            lightboxDesc.textContent = descText;
            lightbox.classList.add('active');
        }

        document.getElementById('closeLightbox').addEventListener('click', () => lightbox.classList.remove('active'));
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('active'); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.classList.remove('active'); });

        // ---------- FILTRY ----------
        document.getElementById('filterContainer').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                const decade = e.target.getAttribute('data-decade');
                renderGallery(decade);
            }
        });

        // ---------- DODAWANIE / EDYCJA ----------
        const modal = document.getElementById('editModal');
        const modalTitle = document.getElementById('modalTitle');
        const imgUrlInput = document.getElementById('imgUrl');
        const imgAltInput = document.getElementById('imgAlt');
        const imgYearInput = document.getElementById('imgYear');
        const imgDescInput = document.getElementById('imgDesc');
        let editingIndex = -1;

        function openEditModal(index = -1) {
            editingIndex = index;
            if (index >= 0 && index < photos.length) {
                const p = photos[index];
                modalTitle.textContent = 'Edytuj zdjęcie';
                imgUrlInput.value = p.src;
                imgAltInput.value = p.alt;
                imgYearInput.value = p.year;
                imgDescInput.value = p.desc;
            } else {
                modalTitle.textContent = 'Dodaj nowe zdjęcie';
                imgUrlInput.value = '';
                imgAltInput.value = '';
                imgYearInput.value = '';
                imgDescInput.value = '';
            }
            modal.classList.add('active');
            imgUrlInput.focus();
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        document.getElementById('addPhotoBtn').addEventListener('click', () => openEditModal(-1));
        document.getElementById('cancelEditBtn').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        document.getElementById('savePhotoBtn').addEventListener('click', () => {
            const newPhoto = {
                id: editingIndex >= 0 ? photos[editingIndex].id : Date.now(),
                src: imgUrlInput.value.trim(),
                alt: imgAltInput.value.trim() || 'Bez tytułu',
                year: imgYearInput.value.trim() || '????',
                desc: imgDescInput.value.trim() || 'Brak opisu'
            };

            if (!newPhoto.src) {
                alert('Proszę podać URL obrazu.');
                return;
            }

            if (editingIndex >= 0) {
                photos[editingIndex] = newPhoto;
            } else {
                photos.push(newPhoto);
            }

            savePhotos();
            renderGallery(currentFilter);  // odśwież z aktualnym filtrem
            closeModal();
        });

        // Usuwanie
        function deletePhoto(index) {
            if (confirm('Czy na pewno usunąć to zdjęcie?')) {
                photos.splice(index, 1);
                savePhotos();
                renderGallery(currentFilter);
            }
        }

        // Inicjalizacja
        loadPhotos();
        renderGallery('all');

        // Udostępnij reset
        window.resetToDefault = resetToDefault;
    </script>
</body>
</html>
